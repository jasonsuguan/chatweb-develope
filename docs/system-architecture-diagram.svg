<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
  <title id="title">Chat Web System Architecture Diagram</title>
  <desc id="desc">Architecture diagram showing frontend input handling, local storage memory, backend task planning, model routing, Gemini execution, MCP tools, and memory update flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #eef6ff; stroke: #bfdbfe; stroke-width: 1.5; }
      .band2 { fill: #f1f8f4; stroke: #bbf7d0; stroke-width: 1.5; }
      .band3 { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; rx: 10; filter: url(#shadow); }
      .boxBlue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.8; rx: 10; filter: url(#shadow); }
      .boxGreen { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.8; rx: 10; filter: url(#shadow); }
      .boxOrange { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.8; rx: 10; filter: url(#shadow); }
      .boxPurple { fill: #faf5ff; stroke: #c084fc; stroke-width: 1.8; rx: 10; filter: url(#shadow); }
      .boxRed { fill: #fff1f2; stroke: #fb7185; stroke-width: 1.8; rx: 10; filter: url(#shadow); }
      .title { font: 700 30px Arial, "Noto Sans TC", sans-serif; fill: #0f172a; }
      .section { font: 700 18px Arial, "Noto Sans TC", sans-serif; fill: #1e293b; }
      .label { font: 700 15px Arial, "Noto Sans TC", sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, "Noto Sans TC", sans-serif; fill: #475569; }
      .tiny { font: 12px Arial, "Noto Sans TC", sans-serif; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrowLight { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .note { fill: #fffbea; stroke: #facc15; stroke-width: 1.3; rx: 9; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1060"/>
  <text class="title" x="720" y="48" text-anchor="middle">Chat Web System Architecture</text>
  <text class="small" x="720" y="75" text-anchor="middle">Multimodal input, Groq task planning, auto model routing, MCP tool use, and local long-term memory</text>

  <rect class="band" x="45" y="105" width="1325" height="230" rx="18"/>
  <text class="section" x="70" y="135">Frontend: Next.js Chat UI</text>

  <rect class="boxBlue" x="75" y="168" width="160" height="78"/>
  <text class="label" x="155" y="198" text-anchor="middle">User</text>
  <text class="small" x="155" y="220" text-anchor="middle">text + files</text>

  <rect class="box" x="285" y="150" width="190" height="115"/>
  <text class="label" x="380" y="181" text-anchor="middle">Chat Web UI</text>
  <text class="small" x="380" y="205" text-anchor="middle">chat rooms</text>
  <text class="small" x="380" y="225" text-anchor="middle">settings</text>
  <text class="small" x="380" y="245" text-anchor="middle">stream display</text>

  <rect class="boxGreen" x="525" y="132" width="225" height="110"/>
  <text class="label" x="637.5" y="163" text-anchor="middle">File Type Detection</text>
  <text class="small" x="637.5" y="187" text-anchor="middle">image / audio / PDF</text>
  <text class="small" x="637.5" y="207" text-anchor="middle">size check</text>
  <text class="small" x="637.5" y="227" text-anchor="middle">convert to data URL</text>

  <rect class="boxGreen" x="525" y="258" width="225" height="52"/>
  <text class="label" x="637.5" y="290" text-anchor="middle">Asset Library</text>

  <rect class="boxPurple" x="815" y="148" width="240" height="118"/>
  <text class="label" x="935" y="180" text-anchor="middle">Browser localStorage</text>
  <text class="small" x="935" y="204" text-anchor="middle">chats</text>
  <text class="small" x="935" y="224" text-anchor="middle">assetLibrary</text>
  <text class="small" x="935" y="244" text-anchor="middle">longTermMemories[]</text>

  <rect class="boxBlue" x="1120" y="160" width="210" height="95"/>
  <text class="label" x="1225" y="191" text-anchor="middle">Chat Request Builder</text>
  <text class="small" x="1225" y="215" text-anchor="middle">text + attachments</text>
  <text class="small" x="1225" y="235" text-anchor="middle">settings + memory</text>

  <path class="arrow" d="M235 207 L285 207"/>
  <path class="arrow" d="M475 186 L525 186"/>
  <path class="arrow" d="M637 242 L637 258"/>
  <path class="arrow" d="M750 284 L1120 218"/>
  <path class="arrow" d="M475 226 C575 330 880 330 1120 236"/>
  <path class="arrowLight" d="M815 207 L750 207"/>
  <path class="arrowLight" d="M1055 207 L1120 207"/>

  <rect class="band2" x="45" y="380" width="1325" height="365" rx="18"/>
  <text class="section" x="70" y="410">Backend: /api/chat</text>

  <rect class="boxBlue" x="85" y="455" width="190" height="92"/>
  <text class="label" x="180" y="486" text-anchor="middle">Receive Request</text>
  <text class="small" x="180" y="510" text-anchor="middle">messages</text>
  <text class="small" x="180" y="530" text-anchor="middle">attachments + memory</text>

  <rect class="boxPurple" x="320" y="432" width="215" height="138"/>
  <text class="label" x="427.5" y="462" text-anchor="middle">Task Planner</text>
  <text class="small" x="427.5" y="486" text-anchor="middle">Groq preprocessor</text>
  <text class="small" x="427.5" y="506" text-anchor="middle">or Gemini planner</text>
  <text class="small" x="427.5" y="526" text-anchor="middle">task type</text>
  <text class="small" x="427.5" y="546" text-anchor="middle">complexity + steps</text>

  <rect class="boxOrange" x="580" y="432" width="215" height="138"/>
  <text class="label" x="687.5" y="462" text-anchor="middle">Model Router</text>
  <text class="small" x="687.5" y="486" text-anchor="middle">manual / auto mode</text>
  <text class="small" x="687.5" y="506" text-anchor="middle">use task plan</text>
  <text class="small" x="687.5" y="526" text-anchor="middle">use file types</text>
  <text class="small" x="687.5" y="546" text-anchor="middle">fallback list</text>

  <rect class="boxGreen" x="835" y="420" width="235" height="160"/>
  <text class="label" x="952.5" y="450" text-anchor="middle">Gemini Execution Model</text>
  <text class="small" x="952.5" y="476" text-anchor="middle">Flash Lite</text>
  <text class="small" x="952.5" y="496" text-anchor="middle">Flash</text>
  <text class="small" x="952.5" y="516" text-anchor="middle">Pro</text>
  <text class="small" x="952.5" y="542" text-anchor="middle">receives text, files,</text>
  <text class="small" x="952.5" y="562" text-anchor="middle">memory, tools, plan</text>

  <rect class="boxRed" x="1120" y="408" width="210" height="190"/>
  <text class="label" x="1225" y="438" text-anchor="middle">MCP Tool Layer</text>
  <text class="small" x="1225" y="466" text-anchor="middle">web search</text>
  <text class="small" x="1225" y="486" text-anchor="middle">weather</text>
  <text class="small" x="1225" y="506" text-anchor="middle">time</text>
  <text class="small" x="1225" y="526" text-anchor="middle">Telegram</text>
  <text class="small" x="1225" y="546" text-anchor="middle">Discord</text>
  <text class="tiny" x="1225" y="574" text-anchor="middle">called only when needed</text>

  <rect class="boxPurple" x="290" y="625" width="250" height="82"/>
  <text class="label" x="415" y="656" text-anchor="middle">Build Context</text>
  <text class="small" x="415" y="680" text-anchor="middle">short-term summary +</text>
  <text class="small" x="415" y="700" text-anchor="middle">long-term memory context</text>

  <rect class="boxBlue" x="835" y="625" width="235" height="82"/>
  <text class="label" x="952.5" y="656" text-anchor="middle">Streaming Response</text>
  <text class="small" x="952.5" y="680" text-anchor="middle">delta text</text>
  <text class="small" x="952.5" y="700" text-anchor="middle">model status</text>

  <path class="arrow" d="M1225 255 C1225 340 180 342 180 455"/>
  <path class="arrow" d="M275 501 L320 501"/>
  <path class="arrow" d="M535 501 L580 501"/>
  <path class="arrow" d="M795 501 L835 501"/>
  <path class="arrow" d="M1070 501 L1120 501"/>
  <path class="arrow" d="M1120 570 C1088 610 1030 610 1000 580"/>
  <path class="arrowLight" d="M275 530 C330 600 345 610 415 625"/>
  <path class="arrowLight" d="M540 666 C640 628 738 606 835 562"/>
  <path class="arrow" d="M952 580 L952 625"/>

  <rect class="band3" x="45" y="790" width="1325" height="130" rx="18"/>
  <text class="section" x="70" y="820">After Response: Memory Update and Persistence</text>

  <rect class="boxPurple" x="140" y="846" width="235" height="55"/>
  <text class="label" x="257.5" y="879" text-anchor="middle">Update Short-term Summary</text>

  <rect class="boxPurple" x="435" y="846" width="245" height="55"/>
  <text class="label" x="557.5" y="879" text-anchor="middle">Update Long-term Memory</text>

  <rect class="boxBlue" x="740" y="846" width="245" height="55"/>
  <text class="label" x="862.5" y="879" text-anchor="middle">Stream Memory Chunks</text>

  <rect class="boxGreen" x="1045" y="846" width="235" height="55"/>
  <text class="label" x="1162.5" y="879" text-anchor="middle">Save to localStorage</text>

  <path class="arrow" d="M952 707 C952 768 257 770 257 846"/>
  <path class="arrow" d="M952 707 C952 770 557 770 557 846"/>
  <path class="arrow" d="M680 874 L740 874"/>
  <path class="arrow" d="M985 874 L1045 874"/>
  <path class="arrowLight" d="M1162 846 C1205 720 1065 310 995 266"/>

  <rect class="note" x="80" y="945" width="1280" height="44"/>
  <text class="tiny" x="720" y="963" text-anchor="middle">Key idea: file type is detected on the frontend before sending; Groq/Gemini planner runs in the backend; long-term memory is stored in browser localStorage,</text>
  <text class="tiny" x="720" y="980" text-anchor="middle">sent to /api/chat, used as context, then updated after the response.</text>
</svg>
